name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Animacoes do jogador (.bbmodel x .animation.json em sincronia)
        run: python3 tools/player_anim/bbsync.py

      # Etapa 4.12: kit de rigs (validador com casos quebrados, template e assets gerados em dia com o contrato).
      - name: Kit de rigs (validador e template)
        run: |
          python3 tools/rigkit/test_rigkit.py
          python3 tools/rigkit/validate_rig.py --repo --quiet
          python3 tools/rigkit/package_kit.py

      # Finisher Scene Authoring Kit: composicao/separacao (Combo PvP, morango, manequins), templates e exemplos em dia
      # (protecao por hash) e o ZIP portatil.
      - name: Kit de autoria de cenas (composição e separação)
        run: |
          python3 tools/scenekit/test_scenekit.py
          python3 tools/scenekit/make_templates.py --check
          python3 tools/scenekit/package_kit.py

      - name: Build with Gradle
        run: ./gradlew build

      # Etapa 4.10: o build baixa o Calamidade_Awakening do release do GitHub (versao e SHA-256 de gradle.properties, hoje
      # 0.14.0; libs/ fora do git). O teste de fumaca confere essa mesma versao carregada e zero efeitos ativos.
      # Os shaders fx sao montados como a RimuLib faz e compilados em GLSL 1.50.
      - name: Shaders fx (glslangValidator)
        run: |
          sudo apt-get install -y -q glslang-tools >/dev/null
          python3 tools/fx/check_shaders.py --strict

      - name: Teste de fumaça no servidor dedicado
        run: bash .github/scripts/server-smoke-test.sh

      - name: Upload do jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: respectcraft-jar
          path: build/libs/*.jar
          if-no-files-found: ignore

      - name: Upload do kit de rigs (ZIP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: respectcraft-rigkit
          path: build/rigkit/*.zip
          if-no-files-found: ignore

      - name: Upload do kit de autoria de cenas (ZIP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: respectcraft-scenekit
          path: build/scenekit/*.zip
          if-no-files-found: ignore

      - name: Upload dos logs do servidor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            smoke/*.log
            run/logs/*.log
          if-no-files-found: ignore

  # Finisher Scene Authoring Kit no Blockbench web REAL (compilado do codigo oficial + plugin GeckoLib, Chromium sem tela):
  # abre os templates, toca as animacoes, mede palco e contatos, exporta pelo plugin e separa o export (tem de bater
  # com os exemplos do repositorio). Tambem abre a variante com texturas multiplas.
  scenekit-blockbench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright (Chromium)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -q playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Blockbench real (templates do kit)
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: bash tools/scenekit/blockbench/check_scene.sh

      - name: Upload das medições do Blockbench
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenekit-blockbench
          path: build/scenekit/blockbench
          if-no-files-found: ignore
