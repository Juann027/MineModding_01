name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Animacoes do jogador (.bbmodel x .animation.json em sincronia)
        run: python3 tools/player_anim/bbsync.py

      - name: Build with Gradle
        run: ./gradlew build

      - name: Teste de fumaça no servidor dedicado
        run: bash .github/scripts/server-smoke-test.sh

      - name: Upload do jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tupinicraft-jar
          path: build/libs/*.jar
          if-no-files-found: ignore

      - name: Upload dos logs do servidor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            smoke/*.log
            run/logs/*.log
          if-no-files-found: ignore
