name: Release

# Publica uma Release no GitHub com o jar do mod sempre que uma tag de versão é enviada.
# Uso: atualize mod_version em gradle.properties, faça commit e rode
#   git tag v<versão> && git push origin v<versão>
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Conferir versão da tag
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com mod_version=$VERSION em gradle.properties"
            exit 1
          fi

      - name: Build com Gradle
        run: ./gradlew build

      - name: Criar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
            --title "TupiniCraft $GITHUB_REF_NAME (Minecraft 1.21.1 / NeoForge)" \
            --notes-file .github/release-notes.md
