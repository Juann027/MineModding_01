modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Juann027"
description='''
RespectCraft: RPG de humor com criador de personagem, roleta de nascimento, habilidades, necessidades e consumíveis, rig GeckoLib do jogador com animações sincronizadas, finalizações cinematográficas e o mob Leão do Fim.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Bibliotecas obrigatórias no cliente E no servidor dedicado (instale junto com o RespectCraft).
[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[${geckolib_version},5)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="smartbrainlib"
    type="required"
    versionRange="[${smartbrainlib_version},)"
    ordering="AFTER"
    side="BOTH"

# Access transformer (camera cinematografica das finalizacoes)
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"
