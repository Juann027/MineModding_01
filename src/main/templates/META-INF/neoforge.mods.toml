modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Juann027"
description='''
TupiniCraft: um mod brasileiro de sátira política. Origens regionais, cargos políticos, XP político, popularidade e eleições multiplayer.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Bibliotecas obrigatórias no cliente E no servidor dedicado (instale junto com o TupiniCraft).
[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[${geckolib_version},5)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="smartbrainlib"
    type="required"
    versionRange="[${smartbrainlib_version},)"
    ordering="AFTER"
    side="BOTH"

# SkillLib é opcional: sem ele o TupiniCraft funciona e as árvores de habilidades ficam desligadas.
# Atenção: o SkillLib 1.4.0 precisa do KubeJS instalado para iniciar (bug do próprio SkillLib).
[[dependencies.${mod_id}]]
    modId="skilllib"
    type="optional"
    versionRange="[${skilllib_version},)"
    ordering="AFTER"
    side="BOTH"
