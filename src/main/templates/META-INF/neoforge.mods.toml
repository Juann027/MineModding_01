modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Juann027"
description='''
RespectCraft: a comedy RPG with a character creator, birth roulette and birth traits, skill trees, needs and consumables, a GeckoLib player rig with synchronized animations, cinematic finishers and the End Lion mob.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Bibliotecas obrigatórias no cliente E no servidor dedicado (instale junto com o RespectCraft).
[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[${geckolib_version},5)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="smartbrainlib"
    type="required"
    versionRange="[${smartbrainlib_version},)"
    ordering="AFTER"
    side="BOTH"

# Rimulib: base dos efeitos visuais futuros (Etapa 4.8). Cliente e servidor; nao vai embutido no jar.
[[dependencies.${mod_id}]]
    modId="rimulib"
    type="required"
    versionRange="[${rimulib_version},2.0)"
    ordering="AFTER"
    side="BOTH"

# Access transformer (camera cinematografica das finalizacoes)
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"
