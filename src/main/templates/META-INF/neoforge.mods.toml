modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Juann027"
description='''
TupiniCraft: um mod brasileiro de sátira política. Origens regionais, cargos políticos, XP político, popularidade e eleições multiplayer.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Bibliotecas obrigatórias no cliente E no servidor dedicado (instale junto com o TupiniCraft).
[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[${geckolib_version},5)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="smartbrainlib"
    type="required"
    versionRange="[${smartbrainlib_version},)"
    ordering="AFTER"
    side="BOTH"

# SkillLib: árvores de habilidades (painel na tecla K). Faixa fechada porque a compra pelo painel depende
# de um detalhe da tela do SkillLib 1.4.x.
[[dependencies.${mod_id}]]
    modId="skilllib"
    type="required"
    versionRange="[${skilllib_version},1.5)"
    ordering="AFTER"
    side="BOTH"

# KubeJS e Rhino: o TupiniCraft não usa, mas o SkillLib 1.4.0 não inicia sem eles (bug do próprio SkillLib).
# Declarados aqui para o jogo listar tudo o que falta de uma vez, em vez de travar com NoClassDefFoundError.
[[dependencies.${mod_id}]]
    modId="kubejs"
    type="required"
    reason="O SkillLib 1.4.0 precisa do KubeJS para iniciar."
    versionRange="[${kubejs_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="rhino"
    type="required"
    reason="Dependência do KubeJS (exigido pelo SkillLib 1.4.0)."
    versionRange="[2101.2.8-build.91,)"
    ordering="NONE"
    side="BOTH"
