modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Juann027"
description='''
TupiniCraft: um mod brasileiro de sátira política. Origens regionais, cargos políticos, XP político, popularidade e eleições multiplayer.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Bibliotecas obrigatórias no cliente E no servidor dedicado (instale junto com o TupiniCraft).
[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[${geckolib_version},5)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="smartbrainlib"
    type="required"
    versionRange="[${smartbrainlib_version},)"
    ordering="AFTER"
    side="BOTH"

# UI Lib (DAQEM): telas da árvore de habilidades (tecla K). Só o CLIENTE precisa; o servidor dedicado não.
[[dependencies.${mod_id}]]
    modId="uilib"
    type="required"
    versionRange="[${uilib_version},10)"
    ordering="AFTER"
    side="CLIENT"

# Architectury API: dependência do UI Lib (o TupiniCraft não usa). Declarada para o jogo avisar se faltar.
[[dependencies.${mod_id}]]
    modId="architectury"
    type="required"
    reason="Dependência do UI Lib."
    versionRange="[13.0.6,)"
    ordering="NONE"
    side="CLIENT"
